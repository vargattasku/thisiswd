<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"> 
<title>og-card</title>
<!-- ============================================================
     카카오톡·SNS 미리보기용 1200x630 카드 원본.
     내용을 고친 뒤 아래 명령으로 image/og-card.png 를 다시 만든다.

       node og-shot.js

     ※ 크롬을 --screenshot 인자로 직접 띄우는 방법은 쓰지 않는다. 이미 떠 있는
       크롬과 프로필이 부딪혀 아무것도 만들지 않고 끝나는 일이 잦다.
       og-shot.js 는 puppeteer 로 붙고, 글꼴(Noto Sans KR)과 사진이 다 도착한
       뒤에 찍으므로 한글이 기본 고딕으로 남거나 사진이 빈 칸이 되지 않는다.
     ※ 카카오톡은 한 번 읽은 미리보기를 캐시한다. 이미지를 바꾼 뒤에는
       https://developers.kakao.com/tool/debugger/sharing 에서 캐시를 지워야 반영된다.

     [배치] 1200x630 고정 판이라 흐름 배치 대신 절대 좌표로 놓는다.
     아래 top/width 값은 완성 이미지에서 실측한 위치다(단위 px, 1200x630 기준).
     글자의 top 은 상자 위쪽이 아니라 획이 실제로 시작하는 높이가 맞도록 잡은
     값이라 소수점이 붙어 있다 — 글자 크기를 바꾸면 top 도 다시 맞춰야 한다.
     ============================================================ -->

<!-- 한글은 본문(index.html)과 같은 Noto Sans KR 을 쓴다 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">

<style>
@font-face{ font-family:'Festigan'; src:url('./font/Festigan.otf') format('opentype'); }

*{ margin:0; padding:0; box-sizing:border-box; }

body{
  position:relative;
  width:1200px; height:630px;
  overflow:hidden;
  color:#2030d0;          /* 본문 --ink */
  background:#F4F0E7;     /* 바탕은 그라데이션 없이 단색 */
  font-weight:300;
}

/* ── 코너 리본 : 본문 .ribbon-frame 과 같은 도형 ──────────────
   카톡 미리보기는 이 카드를 폭 350px 안팎으로 줄여 보여준다. 본문과 같은
   굵기(1.35)로 두면 선이 0.5px 이하로 뭉개져 사라지므로 og 카드에서만
   선을 굵히고(stroke-width 는 아래 svg 쪽) 크기도 키웠다.
   .mark 는 도형이 그려지는 상자이고, 눈에 보이는 리본은 그 안쪽 96% 남짓이다.
   그래서 상자를 115px / 37px 로 두면 보이는 리본이 네 변에서 39px 들어온
   110px 이 된다 — 완성 이미지에서 잰 값이 그것이다 */
.mark{ position:absolute; width:115px; height:115px; }
.mark svg{ width:100%; height:100%; display:block; overflow:visible; }
.mark.tl{ top:37px;    left:37px; }
.mark.tr{ top:37px;    right:37px;  transform:scaleX(-1); }
.mark.bl{ bottom:37px; left:37px;   transform:scaleY(-1); }
.mark.br{ bottom:37px; right:37px;  transform:scale(-1,-1); }

/* ── 가운데 한 줄로 쌓이는 요소들 ─────────────────────────────
   좌우 0 으로 펼치고 text-align:center 로 가운데를 잡는다 */
.line, .names, .info{ position:absolute; left:0; right:0; text-align:center; }

.line{
  top:93.5px;
  font-family:'Festigan',cursive;
  font-size:63px;
  font-weight:400;
  line-height:1;
}

/* 타원 사진 : 본문 2페이지 .photo 와 같은 비율 */
.photo{
  position:absolute;
  top:155px; left:50%;
  width:487px; height:280px;
  margin-left:-243.5px;
  border-radius:50%;
  overflow:hidden;
  background:#F1ECE0;
}
.photo img{
  /* 세로 원본이라 상자보다 세로로 넉넉히 잡고, object-position 으로 인물이
     타원 가운데 오도록 보이는 구간을 내린다 */
  width:100%; height:130%;
  object-fit:cover;
  object-position:center 74.1%;
  display:block;
  filter:grayscale(1);
}

/* 이름·안내는 본문 .intro-date / .intro-place 와 같은 서체.
   카톡에서는 카드가 1/3 크기로 줄어 보이므로 본문 비율보다 키웠다 */
.names, .info{
  font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  line-height:1;
  letter-spacing:-.01em;
}
.names{
  top:459.8px;
  font-size:26.7px;
  font-weight:500;
}
.info{
  top:511.2px;
  font-size:23.3px;
  font-weight:300;
}
.dot{ margin:0 .38em; }    /* 가운뎃점 좌우 숨통 */

/* 이름과 일정 사이의 짧은 구분선 : 본문 .rule 과 같은 농도 */
.rule{
  position:absolute;
  top:500px; left:50%;
  width:38px; height:1px;
  margin-left:-19px;
  background:rgba(45,60,205,.28);
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- stroke-width : 본문은 1.35 지만, 축소되어 보이는 og 카드에서는 그 굵기가 남지 않는다 -->
    <g id="ribbon-corner" fill="none" stroke="#2030d0" stroke-width="2.6"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 22 C16.8 13.6 15.6 4.2 20.6 3 C26.2 1.8 26.8 11.4 22 22"/>
      <path d="M22 22 C13.6 27.2 4.2 28.2 3 23.2 C1.8 17.8 11.4 17.2 22 22"/>
      <path d="M22 22 C31 18.6 37 24 46 20.6 C55 17.2 61 22 71 18.2"/>
      <path d="M22 22 C26 30 19 36 21 44.6 C23 53.2 16 58 18.6 71"/>
    </g>
  </defs>
</svg>

<span class="mark tl"><svg viewBox="0 0 74 74"><use href="#ribbon-corner"/></svg></span>
<span class="mark tr"><svg viewBox="0 0 74 74"><use href="#ribbon-corner"/></svg></span>
<span class="mark bl"><svg viewBox="0 0 74 74"><use href="#ribbon-corner"/></svg></span>
<span class="mark br"><svg viewBox="0 0 74 74"><use href="#ribbon-corner"/></svg></span>

<p class="line">Invitation</p>

<!-- 타원 사진 : 본문 2페이지와 같은 image/wd-web.jpg -->
<figure class="photo">
  <img src="./image/wd-web.jpg" alt="">
</figure>

<p class="names">최정훈<span class="dot">·</span>황지원</p>
<span class="rule"></span>
<p class="info">2026년 11월 14일 토요일 오후 2시<span class="dot">·</span>상주 마리앙스 웨딩컨벤션</p>

</body>
</html>
