<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>og-card</title>
<!-- ============================================================
     카카오톡·SNS 미리보기용 1200x630 카드 원본.
     내용을 고친 뒤 아래 명령으로 image/og-card.png 를 다시 만든다.

     "C:\Program Files\Google\Chrome\Application\chrome.exe" ^
       --headless=new --disable-gpu --hide-scrollbars ^
       --force-device-scale-factor=2 --window-size=1200,630 ^
       --virtual-time-budget=6000 ^
       --screenshot="image\og-card.png" og-card.html

     ※ --virtual-time-budget 은 반드시 넣는다. 한글(Noto Sans KR)은 구글 폰트에서
       내려받고 사진도 불러와야 하는데, 이 옵션이 없으면 도착하기 전에 찍혀서
       한글이 기본 고딕으로, 사진이 빈 칸으로 남은 카드가 만들어진다.
     ※ 카카오톡은 한 번 읽은 미리보기를 캐시한다. 이미지를 바꾼 뒤에는
       https://developers.kakao.com/tool/debugger/sharing 에서 캐시를 지워야 반영된다.
     ============================================================ -->

<!-- 한글은 본문(index.html)과 같은 Noto Sans KR 을 쓴다 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">

<style>
@font-face{ font-family:'Brittany Signature'; src:url('./font/BrittanySignature.ttf') format('truetype'); }
@font-face{ font-family:'Festigan';           src:url('./font/Festigan.otf')          format('opentype'); }
@font-face{ font-family:'Jost';               src:url('./font/Jost-Light.ttf')        format('truetype'); }

*{ margin:0; padding:0; box-sizing:border-box; }

body{
  width:1200px; height:630px;
  overflow:hidden;
  color:#2030d0;
  background:#F7F3EA;
  background-image:
    radial-gradient(120% 70% at 50% 0%,   rgba(255,255,255,.7) 0%, rgba(255,255,255,0) 62%),
    radial-gradient(100% 55% at 50% 100%, rgba(0,0,0,.03) 0%, rgba(0,0,0,0) 62%);
  /* index.html 의 --sans 와 같은 구성 : 영문 Jost, Jost 에 없는 한글은 Noto Sans KR 로 떨어진다 */
  font-family:'Jost','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-weight:300;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

/* 코너 리본 : 청첩장 본문과 같은 도형.
   다만 카톡 미리보기는 이 카드를 폭 350px 안팎으로 줄여서 보여주기 때문에
   본문과 같은 굵기(1.35)로 두면 선이 0.5px 이하로 뭉개져 사라진다.
   그래서 og 카드에서만 선을 굵히고 크기도 키운다(아래 stroke-width 는 svg 쪽에 지정).
   위치도 가장자리에서 더 들여놨다 — 카톡이 이미지 테두리를 잘라내는 경우가 있어
   모서리에 바짝 붙여두면 리본부터 잘려나간다 */
.mark{ position:absolute; width:112px; height:112px; color:#2030d0; }
.mark svg{ width:100%; height:100%; display:block; overflow:visible; }
.mark.tl{ top:50px;    left:56px; }
.mark.tr{ top:50px;    right:56px;  transform:scaleX(-1); }
.mark.bl{ bottom:50px; left:56px;   transform:scaleY(-1); }
.mark.br{ bottom:50px; right:56px;  transform:scale(-1,-1); }

/* 자간은 index.html 과 같은 비율이 되도록 px 대신 em 으로 적는다.
   (본문 gift-line 은 20px 에 -1px = -.05em) */
.line{
  font-family:'Festigan',cursive;
  font-size:25px;
  font-weight:200;
  letter-spacing:-.05em;
  margin-bottom:-20px;
}

/* 이름 아치 : 본문 1페이지와 같은 곡선(M14 106 Q200 -10 386 106).
   글자 크기(47)·자간(4)은 viewBox 400 기준 값이라 본문과 같게 두고,
   svg 자체의 폭만 줄여서 카드 안에서 작게 보이게 한다 */
.arc{ width:470px; height:auto; overflow:visible; display:block; margin-bottom: -20px; }
.arc text{
  fill:currentColor;
  font-family:'Brittany Signature',cursive;
  font-size:40px;
  font-weight:600;      /* 본문 .gift-names 와 같은 굵기 */
  letter-spacing:8px;
}

/* 타원 사진 : 본문 2페이지 .photo 와 같은 비율·보정 */
.photo{
  /* 아치 svg 는 viewBox(400x118) 아래쪽이 비어 있어 그대로 두면 이름과 사진이 벌어진다.
     그 빈 높이만큼 음수 마진으로 당겨 본문 2페이지와 비슷한 간격을 만든다 */
  margin-top:-12px;
  width:400px;
  aspect-ratio:1.5/1;
  border-radius:50%;
  overflow:hidden;
  background:#F1ECE0;
  flex-shrink:0;        /* 세로 630px 안에서 눌려 찌그러지지 않도록 */
}
.photo img{
  width:100%; height:120%;
  object-fit:cover;
  object-position:center 80%;   /* 세로 원본에서 인물이 가운데 오도록 */
  display:block;
  filter:grayscale(1) contrast(1.04);
}

.rule{ width:44px; height:1px; background:rgba(45,60,205,.28); margin:24px 0 20px; }

/* 날짜·장소는 본문 .intro-date / .intro-place 와 같은 서체·자간·농도 */
.date{
  font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:21px;
  font-weight:400;
  letter-spacing:.05em;
  line-height:1.85;
  opacity:.6;
}
.date .dot{ opacity:.35; margin:0 .42em; }   /* 본문의 12px 기준 5px 를 비율로 옮긴 값 */
.place{
  margin-top:14px;
  font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:18px;
  font-weight:400;
  letter-spacing:.03em;
  opacity:.6;
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- stroke-width : 본문은 1.35 지만, 축소되어 보이는 og 카드에서는 그 굵기가 남지 않는다 -->
    <g id="ribbon-corner" fill="none" stroke="currentColor" stroke-width="2.6"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 22 C16.8 13.6 15.6 4.2 20.6 3 C26.2 1.8 26.8 11.4 22 22"/>
      <path d="M22 22 C13.6 27.2 4.2 28.2 3 23.2 C1.8 17.8 11.4 17.2 22 22"/>
      <path d="M22 22 C31 18.6 37 24 46 20.6 C55 17.2 61 22 71 18.2"/>
      <path d="M22 22 C26 30 19 36 21 44.6 C23 53.2 16 58 18.6 71"/>
    </g>
  </defs>
</svg>

<span class="mark tl"><svg viewBox="0 0 74 74"><use href="#ribbon-corner"/></svg></span>
<span class="mark tr"><svg viewBox="0 0 74 74"><use href="#ribbon-corner"/></svg></span>
<span class="mark bl"><svg viewBox="0 0 74 74"><use href="#ribbon-corner"/></svg></span>
<span class="mark br"><svg viewBox="0 0 74 74"><use href="#ribbon-corner"/></svg></span>

<p class="line">Here begins forever</p>

<svg class="arc" viewBox="0 0 400 118" role="img" aria-label="jiwon &amp; jeonghun">
  <defs><path id="arcOg" d="M14 106 Q200 -10 386 106" fill="none"/></defs>
  <text text-anchor="middle"><textPath href="#arcOg" startOffset="52%">jiwon<tspan dx="-2.5">&amp;</tspan><tspan dx="-2.5">jeonghun</tspan></textPath></text>
</svg>

<!-- 타원 사진 : 본문 2페이지와 같은 image/wd-web.jpg -->
<figure class="photo">
  <img src="./image/wd-web.jpg" alt="">
</figure>

<span class="rule"></span>

<p class="date">2026년 11월 14일 토요일<span class="dot">·</span>오후 1시 50분</p>
<p class="place">상주 마리앙스 웨딩컨벤션</p>

</body>
</html>
