<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>fold-outside</title>
<!-- ============================================================
     2단 반접지 — 바깥면 (접었을 때 겉으로 보이는 쪽)

     펼침 210x140mm + 도련 3mm = 216x146mm / 300DPI = 2551x1724 px
     가운데 가로선에서 반으로 접으면 210x70mm 가 된다.

       ┌───────────────────┐  ← 위 절반 : 뒤표지 (180° 뒤집어 배치)
       │      ( 뒤표지 )     │     접었을 때 뒤쪽 면이 되므로 거꾸로 앉힌다
       ├───────────────────┤  ← 접는 선 (시트 정중앙)
       │      ( 앞표지 )     │  ← 아래 절반 : 앞표지 — 접으면 이 면이 위로 온다
       └───────────────────┘

     ?only=... : bg / ribbon / text / guide
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
@font-face{ font-family:'Brittany Signature'; src:url('../font/BrittanySignature.ttf') format('truetype'); }
@font-face{ font-family:'Festigan';           src:url('../font/Festigan.otf')          format('opentype'); }

*{ margin:0; padding:0; box-sizing:border-box; }

:root{
  --bleed: 35.43px;      /* 3mm */
  --ink:   #2030d0;
  --faint: rgba(45,60,205,.18);
  --kr: 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}

body{ width:2551px; height:1724px; overflow:hidden; }

.sheet{
  position:relative;
  width:2551px;
  height:1724px;
  color:var(--ink);
  background:#F7F3EA;
  background-image:
    radial-gradient(120% 60% at 50% 0%,   rgba(255,255,255,.65) 0%, rgba(255,255,255,0) 60%),
    radial-gradient(100% 50% at 50% 100%, rgba(0,0,0,.025) 0%, rgba(0,0,0,0) 60%);
}

/* 각 패널은 시트의 위/아래 절반 (862px = 71mm, 도련 포함) */
.panel{
  position:absolute;
  left:0; right:0;
  height:862px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.panel.cover-back{ top:0;    transform:rotate(180deg); }   /* 뒤표지는 거꾸로 */
.panel.cover-front{ bottom:0; }

body[data-only] [data-layer]{ visibility:hidden; }
body[data-only="bg"]     [data-layer="bg"],
body[data-only="ribbon"] [data-layer="ribbon"],
body[data-only="text"]   [data-layer="text"],
body[data-only="guide"]  [data-layer="guide"]{ visibility:visible; }
body[data-only]:not([data-only="bg"]) .sheet{ background:none; }

/* ── 코너 리본 : 각 패널 기준 ─────────────────────── */
.mark{ position:absolute; width:132px; height:132px; color:var(--ink); }
.mark svg{ width:100%; height:100%; display:block; overflow:visible; }
/* 바깥쪽(재단선 쪽)으로만 둔다 — 접는 선 쪽에 두면 접힌 자리에 걸린다 */
.mark.l{ left:104px;  }
.mark.r{ right:104px; transform:scaleX(-1); }
.cover-front .mark.l,
.cover-front .mark.r{ bottom:104px; }
.cover-front .mark.l{ transform:scaleY(-1); }
.cover-front .mark.r{ transform:scale(-1,-1); }
.cover-back .mark.l,
.cover-back .mark.r{ bottom:104px; }
.cover-back .mark.l{ transform:scaleY(-1); }
.cover-back .mark.r{ transform:scale(-1,-1); }

/* ── 앞표지 ───────────────────────────────────────── */
.arc{ display:block; width:1420px; height:auto; overflow:visible; }
.arc text{
  fill:currentColor;
  font-family:'Brittany Signature',cursive;
  font-size:40px;              /* viewBox(400) 기준 — 모바일·엽서와 같은 값 */
  font-weight:600;
  letter-spacing:4px;
}
.cover-line{
  margin-top:26px;
  font-family:var(--kr);
  font-size:38px;
  font-weight:400;
  letter-spacing:.09em;
  text-indent:.09em;
  opacity:.72;
  text-align:center;
}
.cover-line .dot{ opacity:.4; margin:0 .5em; }

/* ── 뒤표지 : 문구 한 줄만 ───────────────────────── */
.back-line{
  font-family:'Festigan',cursive;
  font-size:62px;
  font-weight:200;
  letter-spacing:-.05em;
  opacity:.9;
}

/* ── 가이드 : 재단선·안전선·접는 선 ───────────────── */
.guide{ display:none; position:absolute; inset:0; pointer-events:none; }
body[data-only="guide"] .guide{ display:block; }
.guide i{ position:absolute; display:block; }
.guide .trim{ inset:var(--bleed); border:1px dashed rgba(255,0,0,.85); }
.guide .safe{ inset:calc(var(--bleed) + 59px); border:1px dashed rgba(0,150,255,.7); }
.guide .fold{           /* 접는 선 : 시트 정중앙 */
  left:0; right:0; top:862px;
  border-top:2px dashed rgba(0,160,60,.8);
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="ribbon-corner" fill="none" stroke="currentColor" stroke-width="1.8"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 22 C16.8 13.6 15.6 4.2 20.6 3 C26.2 1.8 26.8 11.4 22 22"/>
      <path d="M22 22 C13.6 27.2 4.2 28.2 3 23.2 C1.8 17.8 11.4 17.2 22 22"/>
      <path d="M22 22 C31 18.6 37 24 46 20.6 C55 17.2 61 22 71 18.2"/>
      <path d="M22 22 C26 30 19 36 21 44.6 C23 53.2 16 58 18.6 71"/>
    </g>
  </defs>
</svg>

<div class="sheet">

  <!-- ══ 위 절반 : 뒤표지 (180° 회전) ══ -->
  <div class="panel cover-back">
    <span class="mark l" data-layer="ribbon"><svg viewBox="0 0 74 74"><use href="#ribbon-corner"/></svg></span>
    <span class="mark r" data-layer="ribbon"><svg viewBox="0 0 74 74"><use href="#ribbon-corner"/></svg></span>
    <p class="back-line" data-layer="text">Here begins forever</p>
  </div>

  <!-- ══ 아래 절반 : 앞표지 ══ -->
  <div class="panel cover-front">
    <span class="mark l" data-layer="ribbon"><svg viewBox="0 0 74 74"><use href="#ribbon-corner"/></svg></span>
    <span class="mark r" data-layer="ribbon"><svg viewBox="0 0 74 74"><use href="#ribbon-corner"/></svg></span>

    <svg class="arc" data-layer="text" viewBox="0 0 400 118" role="img" aria-label="Jiwon &amp; Jeonghun">
      <defs><path id="arcCover" d="M14 106 Q200 -10 386 106" fill="none"/></defs>
      <text text-anchor="middle"><textPath href="#arcCover" startOffset="52%">Jiwon<tspan dx="-2.5">&amp;</tspan><tspan dx="-2.5">Jeonghun</tspan></textPath></text>
    </svg>

    <p class="cover-line" data-layer="text">2026년 11월 14일 토요일<span class="dot">·</span>상주 마리앙스 웨딩컨벤션</p>
  </div>

  <div class="guide" data-layer="guide">
    <i class="trim"></i>
    <i class="safe"></i>
    <i class="fold"></i>
  </div>

</div>

<script>
var only = new URLSearchParams(location.search).get('only');
if(only) document.body.setAttribute('data-only', only);
</script>
</body>
</html>
