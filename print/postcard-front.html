<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>postcard-front</title>
<!-- ============================================================
     엽서 앞면 : A6 세로 100x148mm + 도련 3mm = 106x154mm
     300DPI 기준 1252 x 1819 px

     이 파일은 "원본"이다. 내용을 고치면 아래 스크립트로 JPG·PSD 를 다시 만든다.
         node print/build.js

     ?only=... 쿼리로 레이어를 하나씩 뽑아낸다 (PSD 를 만들 때 build.js 가 사용).
         bg / ribbon / photo / text / guide

     ※ 색상은 화면용 RGB 다. 인쇄소에 넘기기 전 CMYK 변환이 필요하며,
       특히 이 청첩장의 파란색(#2030d0)은 CMYK 에서 반드시 탁해진다.
       아래 주의사항을 읽고 인쇄소와 상의할 것.
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
@font-face{ font-family:'Brittany Signature'; src:url('../font/BrittanySignature.ttf') format('truetype'); }
@font-face{ font-family:'Festigan';           src:url('../font/Festigan.otf')          format('opentype'); }

*{ margin:0; padding:0; box-sizing:border-box; }

:root{
  /* 3mm = 35.43px @300dpi */
  --bleed: 35.43px;
  --ink:   #2030d0;
  --kr: 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}

body{ width:1252px; height:1819px; overflow:hidden; }

.card{
  position:relative;
  width:1252px;
  height:1819px;
  color:var(--ink);
  background:#F7F3EA;
  background-image:
    radial-gradient(120% 60% at 50% 0%,   rgba(255,255,255,.65) 0%, rgba(255,255,255,0) 60%),
    radial-gradient(100% 50% at 50% 100%, rgba(0,0,0,.025) 0%, rgba(0,0,0,0) 60%);
  /* 도련을 뺀 재단 영역 안쪽에 내용을 담는다 */
  padding:calc(var(--bleed) + 150px) calc(var(--bleed) + 90px) calc(var(--bleed) + 150px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;   /* 남는 세로 여백을 위아래로 고르게 나눈다 */
}

/* ── 레이어 분리용 : ?only=xxx 일 때 해당 레이어만 남긴다 ──
   visibility 로 감춰야 자리(레이아웃)가 그대로 유지되어 레이어끼리 정확히 겹친다 */
body[data-only] [data-layer]{ visibility:hidden; }
body[data-only="bg"]     [data-layer="bg"],
body[data-only="ribbon"] [data-layer="ribbon"],
body[data-only="photo"]  [data-layer="photo"],
body[data-only="text"]   [data-layer="text"],
body[data-only="guide"]  [data-layer="guide"]{ visibility:visible; }
/* 배경은 .card 에 칠해져 있으므로 배경 레이어가 아닐 때는 투명하게 */
body[data-only]:not([data-only="bg"]) .card{ background:none; }

/* ── 코너 리본 ─────────────────────────────────────
   재단선에서 7mm 안쪽. 인쇄에서 선이 끊기지 않도록 굵기는 0.3mm 이상으로 잡았다 */
.mark{ position:absolute; width:150px; height:150px; color:var(--ink); }
.mark svg{ width:100%; height:100%; display:block; overflow:visible; }
.mark.tl{ top:118px;    left:118px; }
.mark.tr{ top:118px;    right:118px;  transform:scaleX(-1); }
.mark.bl{ bottom:118px; left:118px;   transform:scaleY(-1); }
.mark.br{ bottom:118px; right:118px;  transform:scale(-1,-1); }

/* ── 문구 ─────────────────────────────────────────── */
.line{
  font-family:'Festigan',cursive;
  font-size:74px;
  font-weight:200;
  letter-spacing:-.05em;
  margin-bottom:-30px;
}

/* 이름 아치 : 모바일 1페이지와 같은 곡선 */
.arc{ display:block; width:800px; height:auto; overflow:visible; }
.arc text{
  fill:currentColor;
  font-family:'Brittany Signature',cursive;
  font-size:40px;      /* viewBox(400) 기준 — 모바일과 같은 값 */
  font-weight:600;
  letter-spacing:4px;
}

/* ── 타원 사진 ─────────────────────────────────────── */
.photo{
  margin-top:34px;
  width:720px;
  aspect-ratio:1.5/1;
  border-radius:50%;
  overflow:hidden;
  background:#F1ECE0;
  flex-shrink:0;
}
.photo img{
  width:100%; height:120%;
  object-fit:cover;
  object-position:center 80%;
  display:block;
  filter:grayscale(1) contrast(1.04);
}

/* ── 이름 · 날짜 · 장소 ────────────────────────────── */
.intro{
  margin-top:96px;   /* auto 로 두면 사진과 이름 사이가 휑하게 벌어진다 */
  text-align:center;
  font-family:var(--kr);
}
.intro-names{
  font-size:46px;
  font-weight:400;
  letter-spacing:.16em;
  text-indent:.16em;
  line-height:1.4;
}
.intro-names .amp{ opacity:.4; margin:0 9px; letter-spacing:-3px; font-weight:300; }
.intro-rule{
  display:block;
  width:78px; height:2px;
  background:rgba(45,60,205,.18);
  margin:44px auto;
}
.intro-date{
  font-size:36px;
  font-weight:400;
  letter-spacing:.05em;
  line-height:1.85;
  opacity:.8;
}
.intro-date .dot{ opacity:.35; margin:0 .42em; }
.intro-place{
  margin-top:20px;
  font-size:33px;
  font-weight:400;
  letter-spacing:.03em;
  opacity:.8;
}

/* ── 재단 가이드 : 평소에는 꺼둔다. ?only=guide 로 뽑아 PSD 의 숨김 레이어로만 넣는다 ── */
.guide{ display:none; position:absolute; inset:0; pointer-events:none; }
body[data-only="guide"] .guide{ display:block; }
.guide i{ position:absolute; display:block; }
.guide .trim{        /* 재단선 : 도련 3mm 안쪽 */
  inset:var(--bleed);
  border:1px dashed rgba(255,0,0,.85);
}
.guide .safe{        /* 안전선 : 재단선에서 5mm 더 안쪽 — 글자는 이 안에 */
  inset:calc(var(--bleed) + 59px);
  border:1px dashed rgba(0,150,255,.7);
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- stroke-width 1.8 : 150px 로 키워 쓰므로 실제 약 0.31mm — 인쇄에서 끊기지 않는 최소선 이상 -->
    <g id="ribbon-corner" fill="none" stroke="currentColor" stroke-width="1.8"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 22 C16.8 13.6 15.6 4.2 20.6 3 C26.2 1.8 26.8 11.4 22 22"/>
      <path d="M22 22 C13.6 27.2 4.2 28.2 3 23.2 C1.8 17.8 11.4 17.2 22 22"/>
      <path d="M22 22 C31 18.6 37 24 46 20.6 C55 17.2 61 22 71 18.2"/>
      <path d="M22 22 C26 30 19 36 21 44.6 C23 53.2 16 58 18.6 71"/>
    </g>
  </defs>
</svg>

<div class="card">

  <span class="mark tl" data-layer="ribbon"><svg viewBox="0 0 74 74"><use href="#ribbon-corner"/></svg></span>
  <span class="mark tr" data-layer="ribbon"><svg viewBox="0 0 74 74"><use href="#ribbon-corner"/></svg></span>
  <span class="mark bl" data-layer="ribbon"><svg viewBox="0 0 74 74"><use href="#ribbon-corner"/></svg></span>
  <span class="mark br" data-layer="ribbon"><svg viewBox="0 0 74 74"><use href="#ribbon-corner"/></svg></span>

  <p class="line" data-layer="text">Here begins forever</p>

  <svg class="arc" data-layer="text" viewBox="0 0 400 118" role="img" aria-label="Jiwon &amp; Jeonghun">
    <defs><path id="arcFront" d="M14 106 Q200 -10 386 106" fill="none"/></defs>
    <text text-anchor="middle"><textPath href="#arcFront" startOffset="52%">Jiwon<tspan dx="-2.5">&amp;</tspan><tspan dx="-2.5">Jeonghun</tspan></textPath></text>
  </svg>

  <figure class="photo" data-layer="photo">
    <!-- 인쇄는 원본(4672x7008)을 쓴다. 웹용 wd-web.jpg(900px)는 300DPI 에서 해상도가 모자란다 -->
    <img src="../image/wd.jpg" alt="">
  </figure>

  <div class="intro" data-layer="text">
    <p class="intro-names">황지원<span class="amp">·</span>최정훈</p>
    <span class="intro-rule"></span>
    <p class="intro-date">2026년 11월 14일 토요일<span class="dot">·</span>오후 1시 50분</p>
    <p class="intro-place">상주 마리앙스 웨딩컨벤션 마리앙스홀</p>
  </div>

  <div class="guide" data-layer="guide">
    <i class="trim"></i>
    <i class="safe"></i>
  </div>

</div>

<script>
var only = new URLSearchParams(location.search).get('only');
if(only) document.body.setAttribute('data-only', only);
</script>
</body>
</html>
